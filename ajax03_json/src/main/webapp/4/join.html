<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>4/join.html</title>
<script>
	function idCheck(){
		const id=document.getElementById("id").value;
		const span=document.getElementById("idcheck");

		const xhr=new XMLHttpRequest();
		//xhr.onload=function(){} : 응답 다 되면 실행(if문 사용안해도됨)
		xhr.onreadystatechange=function(){  
			if(xhr.readyState==4 && xhr.status==200){			
				const resp=xhr.responseText;
				const json=JSON.parse(resp);
				const exist=json.exist;
				
				if(exist==true){
					span.innerHTML="사용중인 아이디 입니다."
				}else{
					span.innerHTML="사용가능한 아이디입니다."
				}
			}
		}
		
		const data="id=" + id;
		xhr.open('post','idcheck.jsp',true);
		xhr.setRequestHeader("content-type","application/x-www-form-urlencoded");
		xhr.send(data);
	}

</script>
</head>
<body>
<!-- json사용해서 아이디중복검사하기 -->
	<h1>회원가입</h1>
	<form action="idcheck.jsp" method="post">
		아이디 <input type="text" name="id" id="id">
		<input type="button" value="중복확인" onclick="idCheck()">
		<span id="idcheck"></span>

		<br>
		비밀번호 <input type="password" name="pwd"><br>
		이메일 <input type="text" name="email"><br>
		<input type="submit" value="가입">
	</form>
</body>
</html>
