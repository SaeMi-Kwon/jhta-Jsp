<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>6/6.html</title>
</head>
<body>
	<h1>우리우리 홈페이지</h1>
	<h2>회원상세정보 ajax로 불러오기</h2>
	
	<div id="memberinfo"></div>
	
	<script>
		window.onload=function(){
			const xhr=new XMLHttpRequest();
			xhr.onload=function(){
				const div=document.getElementById("memberinfo");
				const resp=xhr.responseText;
				div.innerHTML=resp;
			}
			xhr.open('get','member.jsp',true);
			xhr.send();
		}
		
	</script>
</body>
</html>
