<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>4/join.html</title>
<script>
	function idCheck(){
		const id=document.getElementById("id").value;
		const span=document.getElementById("idcheck");
		if(id==""){
			span.innerHTML="";
			//alert("아이디를 입력하세요");
			return;
		}
		const xhr=new XMLHttpRequest();
		xhr.onreadystatechange= function(){
			if(xhr.readyState==4 && xhr.status==200){
				//alert("success");
				const xml=xhr.responseXML;
				const exist=xml.getElementsByTagName("exist")[0].textContent;
				
				if(exist=='true'){
					span.innerHTML="사용중인 아이디 입니다."
				}else{
					span.innerHTML="사용가능한 아이디입니다."
				}
			}
		}
		xhr.open('get','idcheck.jsp?id='+ id, true);
		xhr.send();
	}
</script>

</head>
<body>
	<h1>회원가입</h1>
	<form action="idcheck.jsp" method="post">
		아이디 <input type="text" name="id" id="id" onkeyup="idCheck()">
		<!-- <input type="button" value="중복확인" onclick="idCheck()"> -->
		<span id="idcheck"></span>

		<br>
		비밀번호 <input type="password" name="pwd"><br>
		이메일 <input type="text" name="email"><br>
		<input type="submit" value="가입">
	</form>
</body>
</html>
